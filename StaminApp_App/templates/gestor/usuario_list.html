{% extends 'base.html' %}
{% block title %}Clientes{% endblock %}
{% block page_title %}Clientes{% endblock %}
{% block content %}
  <div class="card">
    <a class="btn btn-primary" href="{% url 'gestor-usuario-create' %}">Crear cliente</a>
    <div class="divider"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Nombre</th><th>Acciones</th></tr></thead>
        <tbody>
          {% for u in usuarios %}
            <tr>
              <td>{{ u.pk }}</td>
              <td>{{ u.nombre }}</td>
              <td>
                <a class="btn btn-outline btn-sm" href="{% url 'gestor-usuario-detail' u.pk %}">Ver</a>
                <a class="btn btn-outline btn-sm" href="{% url 'gestor-usuario-update' u.pk %}">Editar</a>
                <a class="btn btn-danger btn-sm" href="{% url 'gestor-usuario-delete' u.pk %}">Eliminar</a>
              </td>
            </tr>
          {% empty %}
            <tr><td colspan="3">No hay usuarios.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
