{% extends 'base.html' %}
{% block title %}Eliminar producto{% endblock %}
{% block page_title %}Eliminar producto{% endblock %}
{% block content %}
  <div class="card">
    <p>¿Seguro que quieres eliminar el producto <strong>{{ object.nombre }}</strong>?</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger" type="submit">Sí, eliminar</button>
      <a class="btn btn-outline" href="{% url 'gestor-producto-list' %}">Cancelar</a>
    </form>
  </div>
{% endblock %}
