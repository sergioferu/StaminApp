<html>
  <body>
    <nav>
      <a href="/">Home</a>
      {% if user.is_authenticated %}
        <a href="{% url 'logout' %}">Logout</a>
        {% if user.rol|lower == 'gestor' %}
          <a href="{% url 'gestor-usuario-list' %}">Gestor: Clientes</a>
        {% else %}
          <a href="{% url 'usuario-list' %}">Mi ficha</a>
        {% endif %}
      {% else %}
        <a href="{% url 'login' %}">Login</a>
      {% endif %}
    </nav>

    <h1>Login</h1>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Entrar</button>
    </form>
  </body>
</html>
