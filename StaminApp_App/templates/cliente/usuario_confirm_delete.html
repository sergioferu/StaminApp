{% extends 'base.html' %}
{% block title %}Eliminar cuenta{% endblock %}
{% block page_title %}Eliminar cuenta{% endblock %}
{% block content %}
  <div class="card">
    <p>¿Seguro que quieres eliminar tu cuenta?</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger" type="submit">Sí, eliminar</button>
      <a class="btn btn-outline" href="{% url 'usuario-list' %}">Cancelar</a>
    </form>
  </div>
{% endblock %}
